name: v2 shell

# Rebuilds the v2 Blender shell from data/model.json, verifies the exported
# .glb (walls, openings, rooms), checks the furniture layout against the
# walls and builds the furniture, whenever any of their sources change.
on:
  pull_request:
    paths: ['data/model.json', 'v2/blender/**', 'v2/data/**', '.github/workflows/v2-shell.yml']
  push:
    paths: ['data/model.json', 'v2/blender/**', 'v2/data/**', '.github/workflows/v2-shell.yml']

jobs:
  shell:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'     # bpy 4.5 wheels are built for 3.11
          cache: pip
          cache-dependency-path: v2/blender/requirements.txt
      - name: System libraries for bpy
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends
             libgl1 libglx0 libx11-6 libxext6 libxfixes3 libxi6 libxrender1 libxkbcommon0 libsm6 libice6
      - run: pip install -r v2/blender/requirements.txt
      - name: Build shell
        run: python v2/blender/build_shell.py
      - name: Check glb against model.json
        run: python v2/blender/check_glb.py
      - name: Check furniture layout
        run: python v2/blender/check_furniture.py
      - name: Build furniture
        run: python v2/blender/build_furniture.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-shell
          path: |
            v2/build/shell.glb
            v2/build/furniture.glb
            v2/docs/plan-section.png
          if-no-files-found: ignore

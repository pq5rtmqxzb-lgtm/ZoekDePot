<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  touch-action: none;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
  background: #000;
  position: fixed;
  top: 0; left: 0;
}
canvas { display: block; width: 100%; height: 100%; }
#ui {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none; z-index: 10;
  font-family: 'Georgia', serif;
}
#title {
  position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
  color: #fff; font-size: 22px; font-weight: bold;
  text-shadow: 0 2px 8px rgba(0,0,0,0.7);
  letter-spacing: 2px;
  padding-top: env(safe-area-inset-top, 0px);
}
#score {
  position: absolute; top: 12px; right: 16px;
  color: #fff; font-size: 16px;
  text-shadow: 0 2px 6px rgba(0,0,0,0.7);
  background: rgba(0,0,0,0.4); padding: 8px 14px; border-radius: 20px;
  padding-top: calc(8px + env(safe-area-inset-top, 0px));
}
#hintBtn {
  position: absolute; top: 12px; left: 16px;
  pointer-events: auto; cursor: pointer;
  background: rgba(0,0,0,0.4); color: #fff; border: 1px solid rgba(255,255,255,0.3);
  padding: 8px 16px; border-radius: 20px; font-size: 14px; font-family: 'Georgia', serif;
  padding-top: calc(8px + env(safe-area-inset-top, 0px));
}
#hintBtn:active { background: rgba(255,255,255,0.3); }
#crosshair {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
  width: 20px; height: 20px; opacity: 0.4;
}
#crosshair::before, #crosshair::after {
  content: ''; position: absolute; background: #fff;
}
#crosshair::before { width: 2px; height: 100%; left: 50%; transform: translateX(-50%); }
#crosshair::after { width: 100%; height: 2px; top: 50%; transform: translateY(-50%); }
#joystickArea {
  position: absolute; bottom: 30px; left: 30px;
  width: 120px; height: 120px; pointer-events: auto;
  border-radius: 50%; background: rgba(255,255,255,0.1);
  border: 2px solid rgba(255,255,255,0.3);
}
#joystickKnob {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
  width: 50px; height: 50px; border-radius: 50%;
  background: rgba(255,255,255,0.4);
  border: 2px solid rgba(255,255,255,0.6);
}
#introOverlay {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.88); z-index: 100;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  color: #fff; font-family: 'Georgia', serif; text-align: center;
  padding: 20px;
}
#introOverlay h1 { font-size: 36px; margin-bottom: 20px; letter-spacing: 3px; }
#introOverlay p { font-size: 18px; max-width: 500px; line-height: 1.6; margin-bottom: 10px; }
#startBtn, #replayBtn {
  margin-top: 30px; padding: 16px 40px; font-size: 20px;
  background: #d42828; color: #fff; border: none; border-radius: 8px;
  cursor: pointer; font-family: 'Georgia', serif; letter-spacing: 1px;
}
#startBtn:active, #replayBtn:active { background: #a01e1e; }
#winOverlay {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.88); z-index: 100;
  display: none; flex-direction: column; align-items: center; justify-content: center;
  color: #fff; font-family: 'Georgia', serif; text-align: center;
  padding: 20px;
}
#winOverlay h1 { font-size: 30px; margin-bottom: 20px; color: #FFD700; }
#winOverlay p { font-size: 18px; }
#foundMsg {
  position: absolute; top: 45%; left: 50%; transform: translate(-50%,-50%);
  color: #FFD700; font-size: 28px; font-weight: bold;
  text-shadow: 0 0 20px rgba(255,215,0,0.8), 0 2px 8px rgba(0,0,0,0.8);

.mobile-controls { display: none; }
@media (hover: none) and (pointer: coarse) {
  .mobile-controls { display: block !important; }
  .desktop-controls { display: none !important; }
}

<script type="module">
import * as THREE from 'three';

/* ===== CONSTANTS ===== */
const WALL_HEIGHT = 4.0;
const WALL_THICK = 0.3;
const PLAYER_H = 1.6;
const PLAYER_R = 0.4;
const MOVE_SPEED = 3.8;
const LOOK_SPEED = 0.003;
const NUM_PAINTINGS = 8;
const PW = 1.8;   // painting width
const PH = 1.4;   // painting height

/* ===== STATE ===== */
let camera, scene, renderer, clock;
const playerPos = new THREE.Vector3(0, PLAYER_H, 0);
let yaw = 0, pitch = 0;
let moveF = 0, moveR = 0;
const paintings = [];
let foundCount = 0;
let gameStarted = false;
const wallSegs = [];
const particles = [];
let hintActive = false;
let hintTimer = null;
let hintTarget = null;

/* Keyboard state */
const keys = {};

/* Touch state */
let lookTouchId = null, lookLastX = 0, lookLastY = 0;
let joystickTouchId = null, joystickActive = false;
let jsCenterX = 0, jsCenterY = 0;
const touchStarts = {};

const isMobile = 'ontouchstart' in window;
const joystickEl = document.getElementById('joystickArea');
const knobEl = document.getElementById('joystickKnob');

/* ===== SHARED MATERIALS / OBJECTS ===== */
const WALL_MAT = new THREE.MeshStandardMaterial({ color: 0xf0ece4, roughness: 0.92, metalness: 0 });
const FLOOR_MAT = new THREE.MeshStandardMaterial({ color: 0x8B7355, roughness: 0.55, metalness: 0.05 });
const CEIL_MAT = new THREE.MeshStandardMaterial({ color: 0xe8e4dc, roughness: 0.95 });
const BASEBOARD_MAT = new THREE.MeshStandardMaterial({ color: 0x5c4a3a, roughness: 0.7 });
const TRIM_MAT = new THREE.MeshStandardMaterial({ color: 0x6b5a48, roughness: 0.55, metalness: 0.15 });
const CROWN_MAT = new THREE.MeshStandardMaterial({ color: 0xe0dcd4, roughness: 0.8 });
const FRAME_MAT = new THREE.MeshStandardMaterial({ color: 0x5c4a3a, roughness: 0.5, metalness: 0.1 });
const ARCH_MAT = new THREE.MeshStandardMaterial({ color: 0x4a3a2a, roughness: 0.5, metalness: 0.15 });
const KEYSTONE_MAT = new THREE.MeshStandardMaterial({ color: 0x6b5a48, roughness: 0.4, metalness: 0.2 });
const FRAME_GOLD_MAT = new THREE.MeshStandardMaterial({ color: 0xc8a84e, roughness: 0.32, metalness: 0.7 });
const FRAME_DARK_MAT = new THREE.MeshStandardMaterial({ color: 0x3a3020, roughness: 0.8 });
const PANEL_MAT = new THREE.MeshStandardMaterial({ color: 0x6a4a30, roughness: 0.55, metalness: 0.05 });
const PLINTH_MAT = new THREE.MeshStandardMaterial({ color: 0xcdbfa3, roughness: 0.6, metalness: 0.05 });
const FIXTURE_MAT = new THREE.MeshStandardMaterial({ color: 0x222222, metalness: 0.8, roughness: 0.3 });
const BULB_MAT = new THREE.MeshBasicMaterial({ color: 0xffd9a3 });
const raycaster = new THREE.Raycaster();
const obstacles = [];

/* Procedural texture helper. drawFn paints into a 2D canvas of size w×h.
 * Returns a CanvasTexture with sRGB color space and tiling configured. */
function makeTexture(drawFn, w, h, repU = 1, repV = 1) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  drawFn(c.getContext('2d'), w, h);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = THREE.RepeatWrapping;
  tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(repU, repV);
  return tex;
}

/* ===== INIT ===== */
function init() {
  clock = new THREE.Clock();

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x16140f);
  scene.fog = new THREE.Fog(0x16140f, 9, 26);

  camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.1, 50);
  camera.position.copy(playerPos);

  renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.1;
  document.body.insertBefore(renderer.domElement, document.getElementById('ui'));

  setupTextures();
  buildMuseum();
  setupLights();
  placePaintings();
  setupInput();

  window.addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  });

  // Prevent default touch behaviors on the canvas only — leave overlays
  // free to receive normal taps for buttons.
  renderer.domElement.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
  document.addEventListener('gesturestart', e => e.preventDefault());
  document.addEventListener('gesturechange', e => e.preventDefault());

  animate();
}

/* ===== PROCEDURAL TEXTURES ===== */
function setupTextures() {
  const aniso = renderer.capabilities.maxAnisotropy;

  // Plaster wall — base off-white with low-contrast grain and a few blotches
  const plasterTex = makeTexture((ctx, w, h) => {
    ctx.fillStyle = '#f0ece4';
    ctx.fillRect(0, 0, w, h);
    const img = ctx.getImageData(0, 0, w, h);
    for (let i = 0; i < img.data.length; i += 4) {
      const n = (Math.random() - 0.5) * 22;
      img.data[i]   = Math.max(0, Math.min(255, img.data[i]   + n));
      img.data[i+1] = Math.max(0, Math.min(255, img.data[i+1] + n));
      img.data[i+2] = Math.max(0, Math.min(255, img.data[i+2] + n));
    }
    ctx.putImageData(img, 0, 0);
    for (let i = 0; i < 24; i++) {
      ctx.fillStyle = `rgba(120,108,94,${0.025 + Math.random() * 0.04})`;
      ctx.beginPath();
      ctx.arc(Math.random() * w, Math.random() * h, 18 + Math.random() * 50, 0, Math.PI * 2);
      ctx.fill();
    }
  }, 512, 512, 4, 2);
  plasterTex.anisotropy = aniso;
  WALL_MAT.map = plasterTex;
  WALL_MAT.needsUpdate = true;

  // Wood plank floor — used as a prototype; each room clones with its own
  // repeat so plank scale stays consistent across rooms of different sizes.
  const plankTex = makeTexture((ctx, w, h) => {
    const browns = ['#8a6a47', '#7a5a3d', '#956b48', '#82613f', '#6f5234'];
    const planks = 4;
    const plankH = h / planks;
    for (let py = 0; py < planks; py++) {
      const baseY = py * plankH;
      const segs = 3;
      const offset = (py % 2) * 0.5;
      for (let s = 0; s < segs; s++) {
        const x0 = ((s + offset) % segs) * (w / segs);
        const segW = w / segs;
        ctx.fillStyle = browns[(py * 7 + s * 13) % browns.length];
        ctx.fillRect(x0, baseY, segW, plankH);
        // Vertical grain
        for (let g = 0; g < 14; g++) {
          ctx.strokeStyle = `rgba(34, 22, 12, ${0.10 + Math.random() * 0.16})`;
          ctx.lineWidth = 0.6 + Math.random() * 0.9;
          const gx = x0 + Math.random() * segW;
          ctx.beginPath();
          ctx.moveTo(gx, baseY);
          ctx.bezierCurveTo(
            gx + (Math.random() - 0.5) * 14, baseY + plankH * 0.4,
            gx + (Math.random() - 0.5) * 14, baseY + plankH * 0.7,
            gx + (Math.random() - 0.5) * 14, baseY + plankH
          );
          ctx.stroke();
        }
        // Knots
        if (Math.random() < 0.35) {
          const kx = x0 + Math.random() * segW;
          const ky = baseY + plankH * (0.3 + Math.random() * 0.4);
          ctx.fillStyle = 'rgba(28, 16, 8, 0.55)';
          ctx.beginPath();
          ctx.ellipse(kx, ky, 4 + Math.random() * 5, 2 + Math.random() * 3, 0, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      // Plank seam
      ctx.fillStyle = 'rgba(18, 10, 5, 0.85)';
      ctx.fillRect(0, baseY + plankH - 1, w, 2);
    }
    // Vertical seams every w/segs
    ctx.fillStyle = 'rgba(18, 10, 5, 0.55)';
    for (let s = 1; s < 3; s++) ctx.fillRect((w / 3) * s - 1, 0, 2, h);
  }, 1024, 512);
  plankTex.anisotropy = aniso;
  FLOOR_MAT.map = plankTex;
  FLOOR_MAT.needsUpdate = true;

  // Walnut wall panel — used in the new addWallPanel() helper
  const walnutTex = makeTexture((ctx, w, h) => {
    ctx.fillStyle = '#6a4a30';
    ctx.fillRect(0, 0, w, h);
    for (let i = 0; i < 90; i++) {
      ctx.strokeStyle = `rgba(${30 + Math.random() * 25}, ${20 + Math.random() * 18}, 12, ${0.18 + Math.random() * 0.22})`;
      ctx.lineWidth = 0.5 + Math.random() * 1.4;
      const x = Math.random() * w;
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.bezierCurveTo(
        x + (Math.random() - 0.5) * 10, h * 0.33,
        x + (Math.random() - 0.5) * 10, h * 0.66,
        x + (Math.random() - 0.5) * 10, h
      );
      ctx.stroke();
    }
    // Subtle highlight streaks
    for (let i = 0; i < 18; i++) {
      ctx.strokeStyle = `rgba(170, 130, 90, ${0.05 + Math.random() * 0.08})`;
      ctx.lineWidth = 0.6;
      const x = Math.random() * w;
      ctx.beginPath();
      ctx.moveTo(x, 0); ctx.lineTo(x + (Math.random() - 0.5) * 6, h);
      ctx.stroke();
    }
  }, 256, 256, 1, 1);
  walnutTex.anisotropy = aniso;
  PANEL_MAT.map = walnutTex;
  PANEL_MAT.needsUpdate = true;
}

/* ===== MUSEUM GEOMETRY ===== */
function addWall(x1, z1, x2, z2) {
  const dx = x2 - x1, dz = z2 - z1;
  const len = Math.sqrt(dx * dx + dz * dz);
  if (len < 0.01) return;
  const cx = (x1 + x2) / 2, cz = (z1 + z2) / 2;
  const angle = Math.atan2(dx, dz);

  const geo = new THREE.BoxGeometry(WALL_THICK, WALL_HEIGHT, len);
  const wall = new THREE.Mesh(geo, WALL_MAT);
  wall.position.set(cx, WALL_HEIGHT / 2, cz);
  wall.rotation.y = angle;
  scene.add(wall);

  // Baseboard (taller) + secondary trim strip just above it
  const bb = new THREE.Mesh(
    new THREE.BoxGeometry(WALL_THICK + 0.06, 0.18, len + 0.02),
    BASEBOARD_MAT
  );
  bb.position.set(cx, 0.09, cz);
  bb.rotation.y = angle;
  scene.add(bb);

  const bbTrim = new THREE.Mesh(
    new THREE.BoxGeometry(WALL_THICK + 0.08, 0.03, len + 0.02),
    TRIM_MAT
  );
  bbTrim.position.set(cx, 0.18 + 0.015, cz);
  bbTrim.rotation.y = angle;
  scene.add(bbTrim);

  // Crown molding (taller) + secondary trim strip just below it
  const cm = new THREE.Mesh(
    new THREE.BoxGeometry(WALL_THICK + 0.05, 0.14, len + 0.02),
    CROWN_MAT
  );
  cm.position.set(cx, WALL_HEIGHT - 0.07, cz);
  cm.rotation.y = angle;
  scene.add(cm);

  const cmTrim = new THREE.Mesh(
    new THREE.BoxGeometry(WALL_THICK + 0.08, 0.03, len + 0.02),
    TRIM_MAT
  );
  cmTrim.position.set(cx, WALL_HEIGHT - 0.14 - 0.015, cz);
  cmTrim.rotation.y = angle;
  scene.add(cmTrim);

  wallSegs.push({ x1, z1, x2, z2, len, angle });
}

function addDoorFrame(x1, z1, x2, z2) {
  const dx = x2 - x1, dz = z2 - z1;
  const len = Math.sqrt(dx * dx + dz * dz);
  const cx = (x1 + x2) / 2, cz = (z1 + z2) / 2;
  const angle = Math.atan2(dx, dz);

  // Left pillar
  const pillarH = WALL_HEIGHT * 0.85;
  const pillarW = 0.18;
  const pillarD = WALL_THICK + 0.1;
  const leftPillar = new THREE.Mesh(new THREE.BoxGeometry(pillarD, pillarH, pillarW), FRAME_MAT);
  leftPillar.position.set(x1, pillarH / 2, z1);
  leftPillar.rotation.y = angle;
  scene.add(leftPillar);

  // Right pillar
  const rightPillar = new THREE.Mesh(new THREE.BoxGeometry(pillarD, pillarH, pillarW), FRAME_MAT);
  rightPillar.position.set(x2, pillarH / 2, z2);
  rightPillar.rotation.y = angle;
  scene.add(rightPillar);

  // Top beam (lintel)
  const lintelH = 0.25;
  const lintel = new THREE.Mesh(
    new THREE.BoxGeometry(WALL_THICK + 0.12, lintelH, len + pillarW),
    ARCH_MAT
  );
  lintel.position.set(cx, pillarH + lintelH / 2, cz);
  lintel.rotation.y = angle;
  scene.add(lintel);

  // Decorative keystone at center top + flanking volutes
  const keystone = new THREE.Mesh(
    new THREE.BoxGeometry(WALL_THICK + 0.08, 0.12, 0.25),
    KEYSTONE_MAT
  );
  keystone.position.set(cx, pillarH + lintelH + 0.06, cz);
  keystone.rotation.y = angle;
  scene.add(keystone);

  // Tiny volute scrolls flanking the keystone — placed in the wall's local
  // 'along' direction (which is the BoxGeometry's z axis after rotation).
  const voluteGeo = new THREE.BoxGeometry(WALL_THICK + 0.06, 0.08, 0.12);
  const dirX = dx / len, dirZ = dz / len;
  for (const sgn of [-1, 1]) {
    const vol = new THREE.Mesh(voluteGeo, KEYSTONE_MAT);
    vol.position.set(
      cx + dirX * sgn * 0.22,
      pillarH + lintelH + 0.04,
      cz + dirZ * sgn * 0.22
    );
    vol.rotation.y = angle;
    scene.add(vol);
  }

  // Wall above door (fill gap between lintel and ceiling)
  const aboveH = WALL_HEIGHT - pillarH - lintelH;
  if (aboveH > 0.05) {
    const above = new THREE.Mesh(
      new THREE.BoxGeometry(WALL_THICK, aboveH, len + pillarW),
      WALL_MAT
    );
    above.position.set(cx, pillarH + lintelH + aboveH / 2, cz);
    above.rotation.y = angle;
    scene.add(above);
  }
}

/* Wood-panelled wainscot panel with a thin gold trim border. Placed
 * decoratively on otherwise-blank stretches of wall between paintings. */
function addWallPanel(x, z, ry, w = 1.0, h = 2.4) {
  const group = new THREE.Group();

  const panel = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.025), PANEL_MAT);
  group.add(panel);

  const t = 0.025; // trim thickness
  const td = 0.03; // trim depth
  const trimZ = 0.005;
  const top = new THREE.Mesh(new THREE.BoxGeometry(w + t * 2, t, td), FRAME_GOLD_MAT);
  top.position.set(0, h / 2 + t / 2, trimZ);
  group.add(top);
  const bot = new THREE.Mesh(new THREE.BoxGeometry(w + t * 2, t, td), FRAME_GOLD_MAT);
  bot.position.set(0, -h / 2 - t / 2, trimZ);
  group.add(bot);
  const lt = new THREE.Mesh(new THREE.BoxGeometry(t, h, td), FRAME_GOLD_MAT);
  lt.position.set(-w / 2 - t / 2, 0, trimZ);
  group.add(lt);
  const rt = new THREE.Mesh(new THREE.BoxGeometry(t, h, td), FRAME_GOLD_MAT);
  rt.position.set(w / 2 + t / 2, 0, trimZ);
  group.add(rt);

  group.position.set(x, 1.45, z);
  group.rotation.y = ry;
  scene.add(group);
}

/* Axis-aligned obstacle that blocks the player. Reuses wallCollide() via
 * the shared `obstacles` list. */
function addBoxObstacle(cx, cz, w, d) {
  obstacles.push({ cx, cz, hw: w / 2, hd: d / 2 });
}

function buildMuseum() {
  // Room definitions: center x, center z, width, depth
  const rooms = [
    { x: 0, z: 0, w: 20, d: 8 },     // Main hall
    { x: -6, z: -8, w: 8, d: 8 },     // Left wing
    { x: 6, z: -8, w: 8, d: 8 },      // Right wing
    { x: 0, z: 7.5, w: 12, d: 7 },   // Back gallery (z: 4 to 11)
  ];

  // Each plank tile = 4m × 2m of physical floor, so plank scale stays
  // consistent regardless of room size.
  const PLANK_TILE_W = 4, PLANK_TILE_D = 2;

  rooms.forEach(r => {
    const fg = new THREE.PlaneGeometry(r.w, r.d);
    const fMat = FLOOR_MAT.clone();
    if (FLOOR_MAT.map) {
      fMat.map = FLOOR_MAT.map.clone();
      fMat.map.needsUpdate = true;
      fMat.map.wrapS = fMat.map.wrapT = THREE.RepeatWrapping;
      fMat.map.repeat.set(r.w / PLANK_TILE_W, r.d / PLANK_TILE_D);
      fMat.map.anisotropy = FLOOR_MAT.map.anisotropy;
    }
    const floor = new THREE.Mesh(fg, fMat);
    floor.rotation.x = -Math.PI / 2;
    floor.position.set(r.x, 0, r.z);
    scene.add(floor);

    const ceil = new THREE.Mesh(new THREE.PlaneGeometry(r.w, r.d), CEIL_MAT);
    ceil.rotation.x = Math.PI / 2;
    ceil.position.set(r.x, WALL_HEIGHT, r.z);
    scene.add(ceil);
  });

  // Walls
  // Main hall - front wall with openings to left & right wings
  addWall(-10, -4, -8, -4);    // front far-left
  addWall(-4, -4, 4, -4);      // front center
  addWall(8, -4, 10, -4);      // front far-right
  // Openings: (-8,-4)→(-4,-4) to left wing, (4,-4)→(8,-4) to right wing

  // Main hall - back wall with opening to back gallery
  addWall(-10, 4, -3, 4);      // back left
  addWall(3, 4, 10, 4);        // back right
  // Opening: (-3,4)→(3,4) to back gallery

  addWall(-10, -4, -10, 4);    // left wall
  addWall(10, -4, 10, 4);      // right wall

  // Left wing
  addWall(-10, -4, -10, -12);
  addWall(-2, -4, -2, -12);
  addWall(-10, -12, -2, -12);

  // Right wing
  addWall(2, -4, 2, -12);
  addWall(10, -4, 10, -12);
  addWall(2, -12, 10, -12);

  // Back gallery
  addWall(-6, 4, -6, 11);
  addWall(6, 4, 6, 11);
  addWall(-6, 11, 6, 11);

  // Door frames at each opening
  addDoorFrame(-8, -4, -4, -4);   // Left wing entrance
  addDoorFrame(4, -4, 8, -4);     // Right wing entrance
  addDoorFrame(-3, 4, 3, 4);      // Back gallery entrance

  // Decorative wall paneling between paintings on otherwise blank walls
  // Main hall side walls (paintings at z = ±2; panel between them at z=0)
  addWallPanel(-9.86, 0, Math.PI / 2, 1.0, 2.4);   // left wall, faces +X
  addWallPanel(9.86, 0, -Math.PI / 2, 1.0, 2.4);   // right wall, faces -X
  // Main hall front center wall (between wing entrances) — wall at z = -4
  addWallPanel(0, -3.86, 0, 1.6, 2.4);             // faces +Z
  // Wing back walls — flank the centred painting at x = ±6
  addWallPanel(-8.5, -11.86, 0, 0.9, 2.2);
  addWallPanel(-3.5, -11.86, 0, 0.9, 2.2);
  addWallPanel(3.5, -11.86, 0, 0.9, 2.2);
  addWallPanel(8.5, -11.86, 0, 0.9, 2.2);
  // Back gallery back wall (paintings at x=±2; panel between them)
  addWallPanel(0, 10.86, Math.PI, 1.0, 2.4);

  // Wooden bench in the main hall, set off-centre toward the back gallery so
  // the player spawn at (0,0,0) stays clear of its collision AABB.
  const BENCH_Z = 1.5;
  const benchSeat = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.08, 0.45), BASEBOARD_MAT);
  benchSeat.position.set(0, 0.46, BENCH_Z);
  scene.add(benchSeat);
  const legGeo = new THREE.BoxGeometry(0.16, 0.42, 0.42);
  for (const sx of [-0.85, 0.85]) {
    const leg = new THREE.Mesh(legGeo, BASEBOARD_MAT);
    leg.position.set(sx, 0.21, BENCH_Z);
    scene.add(leg);
  }
  addBoxObstacle(0, BENCH_Z, 2.1, 0.55);
}

/* ===== MONDRIAAN GENERATOR ===== */
function generateMondriaan(cw, ch, potInfo) {
  const c = document.createElement('canvas');
  c.width = cw; c.height = ch;
  const ctx = c.getContext('2d');

  ctx.fillStyle = '#FAFAF5';
  ctx.fillRect(0, 0, cw, ch);

  const M = 8; // margin
  const LW = 3 + Math.random() * 5; // line width

  // Generate horizontal split points
  const hSplits = [M];
  const nh = 3 + Math.floor(Math.random() * 3);
  for (let i = 0; i < nh; i++) {
    const minGap = 40;
    let y = M + minGap + Math.random() * (ch - 2 * M - 2 * minGap);
    hSplits.push(Math.round(y));
  }
  hSplits.push(ch - M);
  hSplits.sort((a, b) => a - b);

  // Remove too-close splits
  for (let i = hSplits.length - 2; i >= 1; i--) {
    if (hSplits[i] - hSplits[i - 1] < 25) hSplits.splice(i, 1);
  }

  // Generate vertical split points
  const vSplits = [M];
  const nv = 3 + Math.floor(Math.random() * 3);
  for (let i = 0; i < nv; i++) {
    const minGap = 40;
    let x = M + minGap + Math.random() * (cw - 2 * M - 2 * minGap);
    vSplits.push(Math.round(x));
  }
  vSplits.push(cw - M);
  vSplits.sort((a, b) => a - b);
  for (let i = vSplits.length - 2; i >= 1; i--) {
    if (vSplits[i] - vSplits[i - 1] < 25) vSplits.splice(i, 1);
  }

  // Mondriaan palette with weights
  const palette = [
    { color: '#FAFAF5', weight: 50 },
    { color: '#D42828', weight: 12 },
    { color: '#1A3F8F', weight: 12 },
    { color: '#F2C41A', weight: 10 },
    { color: '#F0EDE2', weight: 16 },
  ];
  function pickColor() {
    const total = palette.reduce((s, p) => s + p.weight, 0);
    let r = Math.random() * total;
    for (const p of palette) {
      r -= p.weight;
      if (r <= 0) return p.color;
    }
    return '#FAFAF5';
  }

  // Fill cells
  const cells = [];
  for (let i = 0; i < hSplits.length - 1; i++) {
    for (let j = 0; j < vSplits.length - 1; j++) {
      const x = vSplits[j], y = hSplits[i];
      const w = vSplits[j + 1] - x, h = hSplits[i + 1] - y;
      const col = pickColor();
      ctx.fillStyle = col;
      ctx.fillRect(x, y, w, h);
      cells.push({ x, y, w, h, color: col });
    }
  }

  // Draw black grid lines
  ctx.strokeStyle = '#0A0A0A';
  ctx.lineWidth = LW;
  ctx.lineCap = 'butt';

  // Horizontal lines
  hSplits.forEach((y, idx) => {
    const isEdge = idx === 0 || idx === hSplits.length - 1;
    let sx = vSplits[0], ex = vSplits[vSplits.length - 1];
    if (!isEdge && Math.random() < 0.15) sx = vSplits[1] || sx;
    if (!isEdge && Math.random() < 0.15) ex = vSplits[vSplits.length - 2] || ex;
    ctx.beginPath();
    ctx.moveTo(sx, y); ctx.lineTo(ex, y);
    ctx.stroke();
  });

  // Vertical lines
  vSplits.forEach((x, idx) => {
    const isEdge = idx === 0 || idx === vSplits.length - 1;
    let sy = hSplits[0], ey = hSplits[hSplits.length - 1];
    if (!isEdge && Math.random() < 0.15) sy = hSplits[1] || sy;
    if (!isEdge && Math.random() < 0.15) ey = hSplits[hSplits.length - 2] || ey;
    ctx.beginPath();
    ctx.moveTo(x, sy); ctx.lineTo(x, ey);
    ctx.stroke();
  });

  // Draw the hidden flower pot
  drawPot(ctx, cw, ch, LW, potInfo, cells);

  return c;
}

function drawPot(ctx, cw, ch, lw, potInfo, cells) {
  // Pick a cell big enough
  const big = cells.filter(c => c.w > 50 && c.h > 60);
  const cell = big.length ? big[Math.floor(Math.random() * big.length)] : cells[Math.floor(Math.random() * cells.length)];

  const potColors = ['#D42828', '#1A3F8F', '#F2C41A', '#0A0A0A'];
  const pc = potColors[Math.floor(Math.random() * potColors.length)];
  const fc = potColors.filter(c => c !== pc)[Math.floor(Math.random() * 3)];

  // Pot geometry in pixels
  const potW = Math.min(cell.w * 0.45, 55);
  const potTotalH = Math.min(cell.h * 0.6, 70);
  const cx = cell.x + cell.w * 0.3 + Math.random() * cell.w * 0.3;
  const baseY = cell.y + cell.h * 0.55 + Math.random() * cell.h * 0.15;

  const rimW = potW * 0.9;
  const rimH = potTotalH * 0.1;
  const bodyW = potW * 0.7;
  const bodyH = potTotalH * 0.35;
  const baseW = potW * 0.5;
  const baseH = potTotalH * 0.08;
  const stemW = Math.max(2, lw * 0.5);
  const stemH = potTotalH * 0.25;
  const leafW = potW * 0.4;
  const leafH = potTotalH * 0.18;

  const rimY = baseY - rimH;
  const stemTop = rimY - stemH;
  const leafTop = stemTop - leafH;

  // Draw leaf (geometric rectangles)
  ctx.fillStyle = fc;
  ctx.fillRect(cx - leafW / 2, leafTop, leafW, leafH);
  // Accent rectangles on leaf
  const ac = potColors.filter(c => c !== pc && c !== fc)[0] || '#F2C41A';
  ctx.fillStyle = ac;
  ctx.fillRect(cx - leafW * 0.55, leafTop + leafH * 0.1, leafW * 0.3, leafH * 0.5);
  ctx.fillRect(cx + leafW * 0.25, leafTop + leafH * 0.2, leafW * 0.3, leafH * 0.4);

  // Stem
  ctx.fillStyle = '#0A0A0A';
  ctx.fillRect(cx - stemW / 2, stemTop, stemW, stemH);

  // Rim
  ctx.fillStyle = pc;
  ctx.fillRect(cx - rimW / 2, rimY, rimW, rimH);

  // Body
  ctx.fillRect(cx - bodyW / 2, baseY, bodyW, bodyH);

  // Base
  ctx.fillRect(cx - baseW / 2, baseY + bodyH, baseW, baseH);

  // Black outlines (Mondriaan style)
  ctx.strokeStyle = '#0A0A0A';
  ctx.lineWidth = Math.max(1.5, lw * 0.35);
  ctx.strokeRect(cx - rimW / 2, rimY, rimW, rimH);
  ctx.strokeRect(cx - bodyW / 2, baseY, bodyW, bodyH);
  ctx.strokeRect(cx - leafW / 2, leafTop, leafW, leafH);

  // Store pot bounding box in UV (0..1) coordinates
  const px0 = cx - rimW / 2;
  const py0 = leafTop;
  const pw = rimW;
  const ph = (baseY + bodyH + baseH) - leafTop;

  potInfo.u0 = px0 / cw;
  potInfo.v0 = py0 / ch;
  potInfo.u1 = (px0 + pw) / cw;
  potInfo.v1 = (py0 + ph) / ch;
}

/* ===== PLACE PAINTINGS ===== */
/* Build a layered painting frame in `group`'s local space:
 *   - 4 main gold bars
 *   - 4 outer gold bead bars (slightly forward, perimeter beyond main)
 *   - 4 dark inner cove bars (recessed, just outside the painting edge) */
function buildFrame(group) {
  const fd = 0.09, fz = 0.02;
  const mkBar = (w, h, d) => new THREE.BoxGeometry(w, h, d);

  // Main gold bars
  const mainSpecs = [
    [PW + 0.16, 0.08, 0, PH / 2 + 0.04],
    [PW + 0.16, 0.08, 0, -PH / 2 - 0.04],
    [0.08, PH + 0.16, -PW / 2 - 0.04, 0],
    [0.08, PH + 0.16, PW / 2 + 0.04, 0],
  ];
  for (const [w, h, x, y] of mainSpecs) {
    const m = new THREE.Mesh(mkBar(w, h, fd), FRAME_GOLD_MAT);
    m.position.set(x, y, fz);
    group.add(m);
  }

  // Outer bead — thin gold profile around the very perimeter, set forward
  const beadFront = fz + fd / 2 + 0.005;
  const beadD = 0.02;
  const beadSpecs = [
    [PW + 0.20, 0.025, 0, PH / 2 + 0.0925],
    [PW + 0.20, 0.025, 0, -PH / 2 - 0.0925],
    [0.025, PH + 0.20, -PW / 2 - 0.0925, 0],
    [0.025, PH + 0.20, PW / 2 + 0.0925, 0],
  ];
  for (const [w, h, x, y] of beadSpecs) {
    const m = new THREE.Mesh(mkBar(w, h, beadD), FRAME_GOLD_MAT);
    m.position.set(x, y, beadFront - beadD / 2);
    group.add(m);
  }

  // Inner dark cove on all 4 sides — recessed, just outside the painting
  const coveD = fd * 0.55;
  const coveZ = fz + 0.003;
  const coveSpecs = [
    [PW + 0.02, 0.022, 0, PH / 2 + 0.011],
    [PW + 0.02, 0.022, 0, -PH / 2 - 0.011],
    [0.022, PH + 0.02, -PW / 2 - 0.011, 0],
    [0.022, PH + 0.02, PW / 2 + 0.011, 0],
  ];
  for (const [w, h, x, y] of coveSpecs) {
    const m = new THREE.Mesh(mkBar(w, h, coveD), FRAME_DARK_MAT);
    m.position.set(x, y, coveZ);
    group.add(m);
  }
}

function placePaintings() {
  // Positions: x, z, rotation (facing direction)
  const spots = [
    { x: -9.75, z: -2, ry: Math.PI / 2 },     // main hall left wall
    { x: -9.75, z: 2, ry: Math.PI / 2 },      // main hall left wall
    { x: 9.75, z: -2, ry: -Math.PI / 2 },     // main hall right wall
    { x: 9.75, z: 2, ry: -Math.PI / 2 },      // main hall right wall
    { x: -6, z: -11.75, ry: 0 },               // left wing back wall
    { x: 6, z: -11.75, ry: 0 },                // right wing back wall
    { x: -2, z: 10.75, ry: Math.PI },          // back gallery
    { x: 2, z: 10.75, ry: Math.PI },           // back gallery
  ];

  spots.forEach((s, idx) => {
    const potInfo = { u0: 0, v0: 0, u1: 0, v1: 0 };
    const paintCanvas = generateMondriaan(512, 400, potInfo);

    const tex = new THREE.CanvasTexture(paintCanvas);
    tex.minFilter = THREE.LinearFilter;
    tex.magFilter = THREE.LinearFilter;
    tex.colorSpace = THREE.SRGBColorSpace;

    // Painting mesh
    const pGeo = new THREE.PlaneGeometry(PW, PH);
    const pMat = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.25, metalness: 0 });
    const pMesh = new THREE.Mesh(pGeo, pMat);
    // Position painting slightly forward so it's visible (not embedded in wall)
    pMesh.position.z = 0.02;

    // Frame group
    const group = new THREE.Group();
    buildFrame(group);
    group.add(pMesh);

    const yPos = PLAYER_H + 0.15;
    group.position.set(s.x, yPos, s.z);
    group.rotation.y = s.ry;
    scene.add(group);

    // Stone plinth on the floor below each painting + a contrasting top cap.
    // The plinth protrudes into the room, so register it as an obstacle so
    // the player can't phase through it when hugging the wall.
    const plinth = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.5, 0.4), PLINTH_MAT);
    const plinthOff = new THREE.Vector3(0, 0, 0.18).applyAxisAngle(
      new THREE.Vector3(0, 1, 0), s.ry
    );
    const plinthX = s.x + plinthOff.x;
    const plinthZ = s.z + plinthOff.z;
    plinth.position.set(plinthX, 0.25, plinthZ);
    plinth.rotation.y = s.ry;
    scene.add(plinth);
    const plinthCap = new THREE.Mesh(new THREE.BoxGeometry(0.66, 0.04, 0.46), TRIM_MAT);
    plinthCap.position.set(plinthX, 0.52, plinthZ);
    plinthCap.rotation.y = s.ry;
    scene.add(plinthCap);
    // AABB obstacle: plinth's XZ footprint depends on s.ry — for axis-aligned
    // painting rotations (0, ±π/2, π) the footprint is just 0.6 × 0.4 swapped
    // when the painting is rotated 90°.
    const isSideways = Math.abs(Math.cos(s.ry)) < 0.5;
    if (isSideways) addBoxObstacle(plinthX, plinthZ, 0.4, 0.6);
    else            addBoxObstacle(plinthX, plinthZ, 0.6, 0.4);

    // Spotlight on painting — tighter cone, brighter, softer edge than before
    const spot = new THREE.SpotLight(0xfff5e0, 2.6, 4.5, Math.PI / 9, 0.5);
    const off = new THREE.Vector3(0, 1.8, 1.0);
    off.applyAxisAngle(new THREE.Vector3(0, 1, 0), s.ry);
    spot.position.set(s.x + off.x, yPos + off.y, s.z + off.z);
    // Create a separate target object (don't use pMesh, scene.add would reparent it!)
    const spotTarget = new THREE.Object3D();
    spotTarget.position.set(s.x, yPos, s.z);
    spot.target = spotTarget;
    scene.add(spot);
    scene.add(spotTarget);

    // Visible light fixture: dark housing + glowing bulb
    const fix = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.05, 0.1), FIXTURE_MAT);
    fix.position.copy(spot.position);
    fix.position.y += 0.05;
    fix.rotation.y = s.ry;
    scene.add(fix);

    // Emissive bulb peeking out the underside of the housing
    const bulb = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.04, 0.06), BULB_MAT);
    bulb.position.copy(fix.position);
    bulb.position.y -= 0.04;
    bulb.rotation.y = s.ry;
    scene.add(bulb);

    paintings.push({
      mesh: pMesh,
      group,
      potInfo,
      found: false,
      worldPos: new THREE.Vector3(s.x, yPos, s.z),
      index: idx,
    });
  });
}

/* ===== WALL COLLISION ===== */
function wallCollide(nx, nz) {
  for (const w of wallSegs) {
    const dx = w.x2 - w.x1, dz = w.z2 - w.z1;
    const L = w.len;
    const dirX = dx / L, dirZ = dz / L;
    const normX = -dirZ, normZ = dirX;

    const px = nx - w.x1, pz = nz - w.z1;
    const along = px * dirX + pz * dirZ;
    const dist = px * normX + pz * normZ;
    const threshold = WALL_THICK / 2 + PLAYER_R;

    if (along >= -PLAYER_R && along <= L + PLAYER_R && Math.abs(dist) < threshold) {
      return true;
    }
  }
  // Axis-aligned obstacles (benches etc.). AABB inflated by PLAYER_R.
  for (const o of obstacles) {
    if (Math.abs(nx - o.cx) < o.hw + PLAYER_R &&
        Math.abs(nz - o.cz) < o.hd + PLAYER_R) {
      return true;
    }
  }
  return false;
}

/* ===== INPUT ===== */
function setupInput() {
  // Keyboard
  addEventListener('keydown', e => {
    keys[e.code] = true;
    if (!gameStarted) return;
    if (e.code === 'KeyH') showHint();
    if (e.code === 'Escape') {
      const winOv = document.getElementById('winOverlay');
      if (winOv.style.display === 'flex') winOv.style.display = 'none';
    }
  });
  addEventListener('keyup', e => { keys[e.code] = false; });

  // Pointer lock (desktop)
  let isLocked = false;
  renderer.domElement.addEventListener('click', () => {
    if (!gameStarted) return;
    if (!isMobile && !isLocked) {
      renderer.domElement.requestPointerLock();
    }
    if (isLocked) {
      checkPaintingClick(innerWidth / 2, innerHeight / 2);
    }
  });
  document.addEventListener('pointerlockchange', () => {
    isLocked = document.pointerLockElement === renderer.domElement;
  });
  document.addEventListener('mousemove', e => {
    if (isLocked) {
      yaw -= e.movementX * LOOK_SPEED;
      pitch = Math.max(-1, Math.min(1, pitch - e.movementY * LOOK_SPEED));
    }
  });

  // Touch: right side = look + tap
  renderer.domElement.addEventListener('touchstart', e => {
    if (!gameStarted) return;
    e.preventDefault();
    for (const t of e.changedTouches) {
      if (t.clientX > innerWidth * 0.35 && lookTouchId === null) {
        lookTouchId = t.identifier;
        lookLastX = t.clientX;
        lookLastY = t.clientY;
        touchStarts[t.identifier] = { t: Date.now(), x: t.clientX, y: t.clientY, dist: 0 };
      }
    }
  }, { passive: false });

  renderer.domElement.addEventListener('touchmove', e => {
    if (!gameStarted) return;
    e.preventDefault();
    for (const t of e.changedTouches) {
      if (t.identifier === lookTouchId) {
        const s = touchStarts[t.identifier];
        if (s) s.dist += Math.hypot(t.clientX - lookLastX, t.clientY - lookLastY);
        yaw -= (t.clientX - lookLastX) * LOOK_SPEED * 1.3;
        pitch = Math.max(-1, Math.min(1, pitch - (t.clientY - lookLastY) * LOOK_SPEED * 1.3));
        lookLastX = t.clientX;
        lookLastY = t.clientY;
      }
    }
  }, { passive: false });

  renderer.domElement.addEventListener('touchend', e => {
    if (!gameStarted) return;
    e.preventDefault();
    for (const t of e.changedTouches) {
      if (t.identifier === lookTouchId) {
        const s = touchStarts[t.identifier];
        // Only treat as a search-tap if total path length stayed small
        // throughout the gesture, not just start-to-end.
        if (s && Date.now() - s.t < 300 && s.dist < 15) {
          checkPaintingClick(t.clientX, t.clientY);
        }
        delete touchStarts[t.identifier];
        lookTouchId = null;
      }
    }
  }, { passive: false });

  renderer.domElement.addEventListener('touchcancel', e => {
    for (const t of e.changedTouches) {
      if (t.identifier === lookTouchId) { lookTouchId = null; delete touchStarts[t.identifier]; }
    }
  }, { passive: false });

  // Joystick
  joystickEl.addEventListener('touchstart', e => {
    e.preventDefault(); e.stopPropagation();
    const t = e.changedTouches[0];
    joystickTouchId = t.identifier;
    joystickActive = true;
    const r = joystickEl.getBoundingClientRect();
    jsCenterX = r.left + r.width / 2;
    jsCenterY = r.top + r.height / 2;
    updateJoystick(t.clientX, t.clientY);
  }, { passive: false });

  joystickEl.addEventListener('touchmove', e => {
    e.preventDefault(); e.stopPropagation();
    for (const t of e.changedTouches) {
      if (t.identifier === joystickTouchId) updateJoystick(t.clientX, t.clientY);
    }
  }, { passive: false });

  const endJoystick = e => {
    e.preventDefault(); e.stopPropagation();
    for (const t of e.changedTouches) {
      if (t.identifier === joystickTouchId) {
        joystickActive = false;
        joystickTouchId = null;
        moveF = 0; moveR = 0;
        knobEl.style.transform = 'translate(-50%,-50%)';
      }
    }
  };
  joystickEl.addEventListener('touchend', endJoystick, { passive: false });
  joystickEl.addEventListener('touchcancel', endJoystick, { passive: false });

  // Hint
  document.getElementById('hintBtn').addEventListener('click', e => { e.stopPropagation(); showHint(); });

  // Start button
  document.getElementById('startBtn').addEventListener('click', () => {
    gameStarted = true;
    document.getElementById('introOverlay').style.display = 'none';
  });

  // Replay button — reload to a fresh procedurally-generated museum
  document.getElementById('replayBtn').addEventListener('click', () => {
    location.reload();
  });
}

function updateJoystick(tx, ty) {
  let dx = tx - jsCenterX, dy = ty - jsCenterY;
  const max = 45, d = Math.sqrt(dx * dx + dy * dy);
  if (d > max) { dx = dx / d * max; dy = dy / d * max; }
  knobEl.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
  moveF = -dy / max;
  moveR = dx / max;
}

/* ===== PAINTING CLICK ===== */
const _ndc = new THREE.Vector2();
function checkPaintingClick(sx, sy) {
  _ndc.set((sx / innerWidth) * 2 - 1, -(sy / innerHeight) * 2 + 1);
  raycaster.setFromCamera(_ndc, camera);
  raycaster.far = 4.0;

  const meshes = paintings.filter(p => !p.found).map(p => p.mesh);
  if (meshes.length === 0) return;
  const hits = raycaster.intersectObjects(meshes);
  if (hits.length === 0) return;

  const hit = hits[0];
  const painting = paintings.find(p => p.mesh === hit.object);
  if (!painting || painting.found || !hit.uv) return;

  const u = hit.uv.x;
  const v = 1 - hit.uv.y; // flip V
  const pi = painting.potInfo;
  const pad = 0.035;

  if (u >= pi.u0 - pad && u <= pi.u1 + pad && v >= pi.v0 - pad && v <= pi.v1 + pad) {
    onFoundPot(painting);
  }
}

function onFoundPot(p) {
  p.found = true;
  foundCount++;
  document.getElementById('score').textContent = `Gevonden: ${foundCount}/${NUM_PAINTINGS}`;

  // If this painting is currently the hint target, cancel the hint reset so
  // the green found-glow isn't wiped when the hint timer fires.
  if (hintTarget === p) {
    if (hintTimer) { clearTimeout(hintTimer); hintTimer = null; }
    hintActive = false;
    hintTarget = null;
  }

  // Flash message
  const msg = document.getElementById('foundMsg');
  msg.textContent = 'Bloempot gevonden!';
  msg.style.opacity = '1';
  setTimeout(() => { msg.style.opacity = '0'; }, 1800);

  // Glow on painting
  p.mesh.material.emissive.setHex(0x44CC44);
  p.mesh.material.emissiveIntensity = 0.4;
  setTimeout(() => { p.mesh.material.emissiveIntensity = 0.12; }, 2500);

  // Particles
  spawnParticles(p.worldPos);

  // Win check
  if (foundCount >= NUM_PAINTINGS) {
    setTimeout(() => {
      document.getElementById('winOverlay').style.display = 'flex';
    }, 2500);
  }
}

function spawnParticles(pos) {
  const cols = [0xFFD700, 0xFF4444, 0x44FF44, 0x4488FF, 0xFF8800];
  for (let i = 0; i < 25; i++) {
    const g = new THREE.BoxGeometry(0.04, 0.04, 0.04);
    const m = new THREE.MeshBasicMaterial({
      color: cols[Math.floor(Math.random() * cols.length)],
      transparent: true,
    });
    const mesh = new THREE.Mesh(g, m);
    mesh.position.set(
      pos.x + (Math.random() - 0.5) * 0.4,
      pos.y + (Math.random() - 0.5) * 0.4,
      pos.z + (Math.random() - 0.5) * 0.4
    );
    const vel = new THREE.Vector3(
      (Math.random() - 0.5) * 3.5,
      Math.random() * 4 + 2,
      (Math.random() - 0.5) * 3.5
    );
    scene.add(mesh);
    particles.push({ mesh, vel, life: 2.0 });
  }
}

/* ===== HINT ===== */
function showHint() {
  if (hintActive) return;
  const unfound = paintings.filter(p => !p.found);
  if (!unfound.length) return;

  let nearest = unfound[0], nd = playerPos.distanceTo(nearest.worldPos);
  for (const p of unfound) {
    const d = playerPos.distanceTo(p.worldPos);
    if (d < nd) { nd = d; nearest = p; }
  }

  hintActive = true;
  hintTarget = nearest;
  nearest.mesh.material.emissive.setHex(0xFFD700);
  nearest.mesh.material.emissiveIntensity = 0.6;

  if (hintTimer) clearTimeout(hintTimer);
  hintTimer = setTimeout(() => {
    if (!nearest.found) {
      nearest.mesh.material.emissive.setHex(0x000000);
      nearest.mesh.material.emissiveIntensity = 0;
    }
    hintActive = false;
    hintTimer = null;
    if (hintTarget === nearest) hintTarget = null;
  }, 2500);
}

/* ===== GAME LOOP ===== */
function animate() {
  requestAnimationFrame(animate);
  if (!gameStarted) { renderer.render(scene, camera); return; }

  const dt = Math.min(clock.getDelta(), 0.05);

  // Input
  let kf = 0, kr = 0;
  if (keys['KeyW'] || keys['ArrowUp']) kf += 1;
  if (keys['KeyS'] || keys['ArrowDown']) kf -= 1;
  if (keys['KeyA'] || keys['ArrowLeft']) kr -= 1;
  if (keys['KeyD'] || keys['ArrowRight']) kr += 1;

  const fwd = joystickActive ? moveF : kf;
  const rgt = joystickActive ? moveR : kr;

  const sy = Math.sin(yaw), cy = Math.cos(yaw);
  // Camera right vector at yaw is (cos yaw, 0, -sin yaw); camera forward is
  // (-sin yaw, 0, -cos yaw). Strafe was sign-flipped, so D / joystick-right
  // moved the player to their left. Apply +rgt along camera-right.
  const dx = (sy * fwd - cy * rgt) * MOVE_SPEED * dt;
  const dz = (cy * fwd + sy * rgt) * MOVE_SPEED * dt;

  const nx = playerPos.x - dx;
  const nz = playerPos.z - dz;

  if (!wallCollide(nx, playerPos.z)) playerPos.x = nx;
  if (!wallCollide(playerPos.x, nz)) playerPos.z = nz;

  // Bounds
  playerPos.x = Math.max(-11.5, Math.min(11.5, playerPos.x));
  playerPos.z = Math.max(-13.5, Math.min(12.5, playerPos.z));

  camera.position.copy(playerPos);
  camera.rotation.order = 'YXZ';
  camera.rotation.y = yaw;
  camera.rotation.x = pitch;

  // Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    p.vel.y -= 9.8 * dt;
    p.mesh.position.x += p.vel.x * dt;
    p.mesh.position.y += p.vel.y * dt;
    p.mesh.position.z += p.vel.z * dt;
    p.mesh.rotation.x += dt * 3;
    p.mesh.rotation.z += dt * 2;
    p.mesh.material.opacity = Math.max(0, p.life / 2);
    if (p.life <= 0) {
      scene.remove(p.mesh);
      p.mesh.geometry.dispose();
      p.mesh.material.dispose();
      particles.splice(i, 1);
    }
  }

  renderer.render(scene, camera);
}

/* ===== START ===== */
try {
  init();
} catch (err) {
  console.error('Zoek de Pot kon niet starten:', err);
  const intro = document.getElementById('introOverlay');
  if (intro) {
    intro.innerHTML =
      '<h1>Zoek de Pot</h1>' +
      '<p>Je browser ondersteunt geen 3D &mdash; probeer een nieuwere browser.</p>';
  }
}
</script>

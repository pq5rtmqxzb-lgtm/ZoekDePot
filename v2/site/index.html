<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ons Nieuwe Huis — v2</title>
  <link rel="icon" href="data:,">
  <style>
    :root { --ink: #f4f1ea; --dim: rgba(244, 241, 234, .72); --glass: rgba(24, 22, 20, .55); }
    html, body { margin: 0; height: 100%; background: #1b1a18; color: var(--ink);
      font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
    #view { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; }
    .hud { position: fixed; pointer-events: none; }
    #room { top: 16px; left: 16px; padding: 6px 12px; border-radius: 8px; background: var(--glass);
      backdrop-filter: blur(6px); font-weight: 600; letter-spacing: .01em; }
    #moods { bottom: 16px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px;
      padding: 6px; border-radius: 12px; background: var(--glass); backdrop-filter: blur(6px); pointer-events: auto; }
    #moods button { border: 0; border-radius: 8px; padding: 8px 14px; font: inherit; color: var(--ink);
      background: transparent; cursor: pointer; }
    #moods button[aria-pressed="true"] { background: rgba(244, 241, 234, .18); }
    button { font: inherit; color: var(--ink); cursor: pointer; }
    .big { border: 0; border-radius: 12px; padding: 14px 20px; font-size: 18px; font-weight: 600;
      background: var(--glass); backdrop-filter: blur(6px); pointer-events: auto; }
    .big.primary { background: #c8a46a; color: #1b1a18; }
    #tourbtn { bottom: 16px; right: 16px; }
    #start { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; pointer-events: auto; }
    #start[hidden] { display: none; }
    #start .big { background: rgba(244, 241, 234, .16); }
    #start .big.primary { background: #c8a46a; font-size: 20px; padding: 16px 20px; }
    #tour { bottom: 16px; left: 50%; transform: translateX(-50%); width: min(620px, calc(100% - 32px));
      box-sizing: border-box; padding: 16px 18px; border-radius: 14px; background: rgba(24, 22, 20, .72);
      backdrop-filter: blur(8px); pointer-events: auto; }
    #tour[hidden], #tourbtn[hidden] { display: none; }
    #tour .step { font-size: 14px; color: var(--dim); }
    #tour h2 { font-size: 22px; margin: 2px 0 4px; }
    #tour p { font-size: 17px; margin: 0 0 12px; color: var(--ink); }
    #tour .row { display: flex; flex-wrap: wrap; gap: 8px; }
    #tour .row button { flex: 1 1 auto; min-height: 48px; border: 0; border-radius: 10px; padding: 10px 14px;
      font-size: 17px; background: rgba(244, 241, 234, .16); }
    #tour .row #tourpause { background: #c8a46a; color: #1b1a18; font-weight: 600; }
    body.touring #moods, body.touring #tourbtn { display: none; }
    #fade { inset: 0; background: #1b1a18; opacity: 0; transition: opacity .3s; }
    #help { top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; padding: 18px 22px;
      border-radius: 12px; background: var(--glass); backdrop-filter: blur(6px); max-width: 340px; }
    #help h1 { font-size: 20px; margin: 0 0 6px; }
    #help p { margin: 4px 0; color: var(--dim); }
    #help.hidden { display: none; }
    #load { top: 0; left: 0; height: 3px; background: #c8a46a; width: 0; transition: width .2s; }
    #stick { width: 120px; height: 120px; border-radius: 50%; border: 2px solid rgba(244, 241, 234, .35);
      display: none; }
    @media (pointer: coarse) { #help .desk { display: none; } }
    @media (pointer: fine) { #help .touch { display: none; } }
  </style>
  <script type="module" crossorigin src="./assets/index-CYd4q48l.js"></script>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="load" class="hud"></div>
  <div id="room" class="hud">…</div>
  <div id="help" class="hud">
    <h1>Ons Nieuwe Huis</h1>
    <p id="loadtext">Laden…</p>
    <div id="start" hidden>
      <button id="starttour" class="big primary">▶&#xFE0E; Start de rondleiding</button>
      <p>De rondleiding loopt vanzelf door alle kamers; alleen kijken is genoeg.</p>
      <button id="startfree" class="big">Zelf rondlopen</button>
      <p class="desk">Klik om rond te kijken · <b>WASD</b> of pijltjes om te lopen · <b>Esc</b> om los te laten</p>
      <p class="touch">Sleep links om te lopen, rechts om rond te kijken</p>
    </div>
  </div>
  <div id="stick" class="hud"></div>
  <div id="moods" class="hud" role="group" aria-label="Lichtsfeer">
    <button data-mood="day" aria-pressed="true">Dag</button>
    <button data-mood="evening" aria-pressed="false">Avond</button>
    <button data-mood="night" aria-pressed="false">Nacht</button>
  </div>
  <button id="tourbtn" class="hud big" hidden>▶&#xFE0E; Rondleiding</button>
  <div id="tour" class="hud" hidden role="region" aria-label="Rondleiding" aria-live="polite">
    <div class="step" id="tourstep"></div>
    <h2 id="tourtitle"></h2>
    <p id="tourtext"></p>
    <div class="row">
      <button id="tourprev">◀&#xFE0E; Vorige</button>
      <button id="tourpause">❚❚ Pauze</button>
      <button id="tournext">Volgende ▶&#xFE0E;</button>
      <button id="tourstop">✕ Stoppen</button>
    </div>
  </div>
  <div id="fade" class="hud"></div>
</body>
</html>
